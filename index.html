<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#D81A07" />
    <meta name="msapplication-TileColor" content="#D81A07" />

    <!-- Favicon & Brand Logo Setup for Google Search Results & Browser Tabs -->
    <link rel="icon" type="image/webp" href="/tendoz_logo.webp" />
    <link rel="apple-touch-icon" sizes="180x180" href="/tendoz_logo.webp" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Search Engine Canonical Tag -->
    <link rel="canonical" href="https://tendoz.pk/" />

    <!-- SEO Meta Title & Meta Description -->
    <title>Tendoz Restaurant Sahiwal – Handcrafted Burgers, Pizzas & Broast</title>
    <meta
      name="description"
      content="Official online food ordering app for Tendoz Restaurant Sahiwal. Order handcrafted burgers, stone-baked pizzas, crispy broast, and loaded wraps for fast delivery & takeaway."
    />
    <meta
      name="keywords"
      content="Tendoz, Tendoz Sahiwal, Tendoz Restaurant, Fast Food Sahiwal, Pizza Sahiwal, Burgers Sahiwal, Injected Broast, Crispy Chicken, Online Food Delivery Sahiwal"
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- OpenGraph Social Share Card Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tendoz.pk/" />
    <meta property="og:site_name" content="Tendoz Restaurant Sahiwal" />
    <meta property="og:title" content="Tendoz Restaurant Sahiwal – Handcrafted Burgers, Pizzas & Broast" />
    <meta
      property="og:description"
      content="Official online food ordering app for Tendoz Restaurant Sahiwal. Order handcrafted burgers, stone-baked pizzas, crispy broast, and loaded wraps."
    />
    <meta property="og:image" content="https://tendoz.pk/tendoz_logo.webp" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Tendoz Restaurant Official Logo" />

    <!-- Twitter / X Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tendoz Restaurant Sahiwal – Handcrafted Burgers, Pizzas & Broast" />
    <meta
      name="twitter:description"
      content="Official online food ordering app for Tendoz Restaurant Sahiwal. Order handcrafted burgers, stone-baked pizzas, crispy broast, and loaded wraps."
    />
    <meta name="twitter:image" content="https://tendoz.pk/tendoz_logo.webp" />

    <!-- Performance & Font Optimization (Non-blocking Async, Max 2 Weights: 600, 800) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap"
      />
    </noscript>

    <!-- Critical LCP Hero Banner & Brand Logo Preloads (Discovered in initial HTML with fetchpriority="high") -->
    <link rel="preload" as="image" href="/tendoz_banner_hero.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/tendoz_logo.webp" type="image/webp" fetchpriority="high" />

    <!-- Inlined Critical CSS for Sub-800ms First Contentful Paint (FCP) and Zero CLS -->
    <style>
      html {
        scroll-behavior: smooth;
        scrollbar-gutter: stable;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #fafafa;
        color: #171717;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }
      @keyframes skeletonShimmerFlow {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .skeleton-shimmer {
        background: linear-gradient(90deg, #ECEEF1 0%, #F4F5F7 35%, #E4E7EB 70%, #ECEEF1 100%);
        background-size: 200% 100%;
        animation: skeletonShimmerFlow 1.8s ease-in-out infinite;
      }
      .initial-header {
        height: 64px;
        background-color: #ffffff;
        border-bottom: 1px solid rgba(229, 231, 235, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .initial-hero-wrap {
        padding: 12px 16px;
        max-width: 1152px;
        margin: 0 auto;
      }
      .initial-hero-box {
        width: 100%;
        aspect-ratio: 3 / 1;
        border-radius: 1.25rem;
        overflow: hidden;
        background-color: #171717;
        position: relative;
      }
      .initial-hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
    </style>

    <!-- Schema.org Structured Data (JSON-LD) for Local Business & Fast Food Restaurant -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FastFoodRestaurant",
      "@id": "https://tendoz.pk/#restaurant",
      "name": "Tendoz Restaurant Sahiwal",
      "alternateName": "Tendoz Fast Food",
      "image": "https://tendoz.pk/tendoz_logo.webp",
      "url": "https://tendoz.pk/",
      "telephone": "+923200089000",
      "priceRange": "Rs. 200 - Rs. 3500",
      "servesCuisine": [
        "Fast Food",
        "Burgers",
        "Pizza",
        "Fried Chicken",
        "Injected Broast",
        "Wraps"
      ],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Near Pilot Girls School",
        "addressLocality": "Sahiwal",
        "addressRegion": "Punjab",
        "postalCode": "57000",
        "addressCountry": "PK"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "30.6682",
        "longitude": "73.1014"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "10:30",
          "closes": "02:30"
        }
      ],
      "hasMenu": "https://tendoz.pk/#menu",
      "acceptsReservations": "False",
      "sameAs": [
        "https://www.facebook.com/share/1Ro9HvmYUM/",
        "https://www.instagram.com/tendoz.official"
      ]
    }
    </script>
  </head>
  <body class="bg-neutral-100 text-neutral-900 antialiased font-sans selection:bg-[#D81A07] selection:text-white">
    <div id="root">
      <!-- Critical Initial Shell: Immediate LCP Discovery in HTML -->
      <div class="initial-header">
        <img
          src="/tendoz_logo.webp"
          alt="Tendoz Restaurant"
          width="45"
          height="45"
          fetchpriority="high"
          style="width: 45px; height: 45px; object-fit: contain; border-radius: 12px;"
        />
      </div>
      <div class="initial-hero-wrap">
        <div class="initial-hero-box">
          <img
            src="/tendoz_banner_hero.webp"
            alt="Tendoz Special Deals"
            width="1200"
            height="400"
            fetchpriority="high"
            class="initial-hero-img"
          />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
